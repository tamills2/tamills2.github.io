<!doctype html>
<html lang="en" data-theme="light" data-repo-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Builder | Repo</title>
  <meta name="description" content="Insert repository notes into an editable document, then copy or download it as a Linux LF text file.">

  <script>
    (() => {
      const saved = localStorage.getItem("repo-theme");
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>

  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/tools.css">
  <link rel="stylesheet" href="./tool.css">

  <script src="../../js/theme.js" defer></script>
  <script src="../../js/tool-base.js" defer></script>
  <script src="./tool.js" defer></script>
</head>
<body class="tool-page-shell">
  <div id="shared-tool-header"></div>

  <main class="tool-main note-builder-main">
    <div class="tool-heading">
      <p class="eyebrow">Repo tool</p>
      <h1>Note Builder</h1>
    </div>

    <section class="builder-layout" aria-label="Note builder">
      <aside class="library-pane">
        <div class="pane-heading">
          <div>
            <h2>Available notes</h2>
            <p id="note-count">Loading…</p>
          </div>
        </div>

        <label class="tool-field note-search-field">
          <span>Search note names</span>
          <input
            id="note-search"
            class="tool-input"
            type="search"
            placeholder="Type a note name…"
            autocomplete="off"
            spellcheck="false"
          >
        </label>

        

        <div id="available-notes" class="available-notes" role="listbox" aria-label="Available notes">
          <p class="empty-message">Loading notes…</p>
        </div>
      </aside>

      <section class="editor-pane">
        <div class="editor-toolbar">
          <label class="tool-field filename-field">
            <span>File name</span>
            <input
              id="filename-input"
              class="tool-input"
              type="text"
              value="combined-notes.txt"
              autocomplete="off"
              spellcheck="false"
            >
          </label>

          <div class="editor-actions">
            <button id="copy-button" class="tool-secondary-button" type="button" disabled>
              Copy text
            </button>
            <button id="download-button" class="tool-primary-button" type="button" disabled>
              Save text file
            </button>
            <button id="clear-button" class="tool-secondary-button" type="button" disabled>
              Clear
            </button>
          </div>
        </div>

        <div class="editor-status-row">
          <p id="status-message" class="status-message" aria-live="polite">Loading notes…</p>
          <p id="document-counts" class="document-counts">0 characters · 0 lines</p>
        </div>

        <label class="editor-label" for="document-editor">Combined document</label>
        <textarea
          id="document-editor"
          class="document-editor"
          placeholder="Double-click or drag notes here. You can edit anything before saving."
          spellcheck="false"
        ></textarea>

        
      </section>
    </section>
  </main>
</body>
</html>
