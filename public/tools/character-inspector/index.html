<!doctype html>
<html lang="en" data-theme="light" data-repo-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Inspector | Repo</title>
  <meta name="description" content="Display every character in a string as an outlined box and identify it clearly on hover.">

  <script>
    (() => {
      const saved = localStorage.getItem("repo-theme");
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>

  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/tools.css">
  <link rel="stylesheet" href="./tool.css">

  <script src="../../js/theme.js" defer></script>
  <script src="../../js/tool-base.js" defer></script>
  <script src="./tool.js" defer></script>
</head>
<body class="tool-page-shell">
  <div id="shared-tool-header"></div>

  <main class="tool-main character-main">
    <div class="tool-heading">
      <p class="eyebrow">Repo tool</p>
      <h1>Character Inspector</h1>
    </div>

    <section class="tool-card inspector-card" aria-labelledby="input-title">
      <div class="section-title-row">
        <div>
          <h2 id="input-title">String to inspect</h2>
          
        </div>
      </div>

      <div class="tool-field">
        <label for="character-input">Text</label>
        <textarea
          class="tool-textarea character-input"
          id="character-input"
          rows="5"
          placeholder="Paste or type a string"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
      </div>

      <div class="tool-button-row">
        <button class="tool-secondary-button" id="clear-button" type="button">Clear</button>
      </div>
    </section>

    <section class="character-output-section" aria-labelledby="results-title">
      <div class="output-label-row">
        <h2 id="results-title">Characters</h2>
        <span id="character-count" aria-live="polite">0 characters</span>
      </div>

      

      <div
        class="character-box-row"
        id="character-grid"
        role="list"
        aria-label="Inspected characters"
        hidden
      ></div>
    </section>
  </main>
</body>
</html>
