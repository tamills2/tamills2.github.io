<!doctype html>
<html lang="en" data-theme="light" data-repo-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Template | Repo</title>
  <meta name="description" content="Reusable Repo tool template.">

  <script>
    (() => {
      const saved = localStorage.getItem("repo-theme");
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>

  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/tools.css">

  <script src="../../js/theme.js" defer></script>
  <script src="../../js/tool-base.js" defer></script>
</head>
<body class="tool-page-shell">
  <div id="shared-tool-header"></div>

  <main class="tool-main">
    <div class="tool-heading">
      <p class="eyebrow">Repo tool</p>
      <h1>Tool Template</h1>
      <p>Duplicate this folder, rename it, and replace this example interface with your tool.</p>
    </div>

    <section class="tool-card" aria-labelledby="tool-form-title">
      <h2 id="tool-form-title">Example input</h2>
      <div class="tool-field">
        <label for="example-input">Text</label>
        <input class="tool-input" id="example-input" type="text" placeholder="Type something">
      </div>
      <div class="tool-button-row">
        <button class="tool-primary-button" id="run-tool" type="button">Run</button>
        <button class="tool-secondary-button" id="clear-tool" type="button">Clear</button>
      </div>
      <output class="tool-output" id="tool-output" aria-live="polite">Your result will appear here.</output>
    </section>
  </main>
</body>
</html>
