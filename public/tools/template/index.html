<!doctype html>
<html lang="en" data-theme="light" data-repo-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Template | Repo</title>
  <meta name="description" content="Reusable Repo tool template.">

  <script>
    (() => {
      const saved = localStorage.getItem("repo-theme");
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>

  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/tools.css">
  <link rel="stylesheet" href="./tool.css">

  <script src="../../js/theme.js" defer></script>
  <script src="../../js/tool-base.js" defer></script>
  <script src="./tool.js" defer></script>
</head>
<body class="tool-page-shell">
  <header class="site-header">
    <div class="header-left">
      <a class="tool-header-home" href="../../" aria-label="Open Notes homepage">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>Notes</span>
      </a>
    </div>

    <a class="site-title" href="../../">Repo</a>

    <div class="header-right">
      <div class="site-search">
        <label class="visually-hidden" for="site-search-input">Search the entire site</label>
        <div class="search-input-shell">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="site-search-input" type="search" placeholder="Search site" autocomplete="off" spellcheck="false">
          <kbd>⌘K</kbd>
        </div>
      </div>

      <div class="dropdown">
        <button class="tools-button" id="tools-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tools-menu">
          Tools
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg>
        </button>
        <div class="tools-menu" id="tools-menu" role="menu" hidden>
          <a href="../regex-generator/" role="menuitem">Regex Generator</a>
          <a href="../template/" role="menuitem">Tool Template</a>
          <!-- Add links to your real tools here. -->
        </div>
      </div>

      <div class="theme-switch-wrapper">
        <span class="theme-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
        </span>
        <button class="theme-switch" id="theme-switch" data-theme-switch type="button" role="switch" aria-label="Use dark mode" aria-checked="false">
          <span class="theme-switch-thumb"></span>
        </button>
        <span class="theme-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"></path></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="tool-main">
    <div class="tool-heading">
      <p class="eyebrow">Repo tool</p>
      <h1>Tool Template</h1>
      <p>Duplicate this folder, rename it, and replace this example interface with your tool.</p>
    </div>

    <section class="tool-card" aria-labelledby="tool-form-title">
      <h2 id="tool-form-title">Example input</h2>
      <div class="tool-field">
        <label for="example-input">Text</label>
        <input class="tool-input" id="example-input" type="text" placeholder="Type something">
      </div>
      <div class="tool-button-row">
        <button class="tool-primary-button" id="run-tool" type="button">Run</button>
        <button class="tool-secondary-button" id="clear-tool" type="button">Clear</button>
      </div>
      <output class="tool-output" id="tool-output" aria-live="polite">Your result will appear here.</output>
    </section>
  </main>
</body>
</html>
