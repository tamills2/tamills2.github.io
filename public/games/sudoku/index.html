<!doctype html>
<html lang="en" data-theme="light" data-repo-root="../../">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku | Repo</title>
  <script>(()=>{const s=localStorage.getItem('repo-theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
  <link rel="stylesheet" href="../../css/styles.css"><link rel="stylesheet" href="../../css/tools.css"><link rel="stylesheet" href="../../css/games.css"><link rel="stylesheet" href="./game.css">
  <script src="../../js/theme.js" defer></script><script src="../../js/tool-base.js" defer></script><script src="./game.js" defer></script>
</head>
<body class="tool-page-shell"><div id="shared-tool-header"></div>
<main class="game-main sudoku-main">
  <div class="game-heading"><p class="eyebrow">Games</p><h1>Sudoku</h1></div>
  <div class="game-toolbar">
    <select class="game-select" id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
    <button class="game-button primary" id="daily-button" type="button">Daily</button>
    <button class="game-button" id="practice-button" type="button">New practice</button>
    <button class="game-button" id="stats-button" type="button">Stats</button>
    <button class="game-button icon-button" id="settings-button" type="button" aria-label="Settings" title="Settings">
      <svg class="stroke-icon settings-gear-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.6 2.7h4.8l.7 2.3c.6.2 1.2.5 1.7.9l2.3-.6 2.4 4.1-1.7 1.8c.1.6.1 1.2 0 1.8l1.7 1.8-2.4 4.1-2.3-.6c-.5.4-1.1.7-1.7.9l-.7 2.3H9.6l-.7-2.3c-.6-.2-1.2-.5-1.7-.9l-2.3.6-2.4-4.1L4.2 13a8.2 8.2 0 0 1 0-1.8L2.5 9.4l2.4-4.1 2.3.6c.5-.4 1.1-.7 1.7-.9l.7-2.3Z"/>
        <circle cx="12" cy="12" r="3.4"/>
      </svg>
    </button>
    <button class="game-button icon-button" id="pause-button" type="button" aria-label="Pause" title="Pause" aria-pressed="false">
      <svg class="pause-icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      <svg class="play-icon stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
    </button>
  </div>
  <div class="game-status-row"><span id="sudoku-mode">Daily</span><span id="timer">00:00</span><span id="sudoku-message" aria-live="polite"></span></div>
  <div class="sudoku-layout">
    <div class="sudoku-board-wrap">
      <section class="sudoku-board" id="sudoku-board" aria-label="Sudoku board"></section>
      <button class="sudoku-pause-cover" id="pause-cover" type="button" aria-label="Resume Sudoku" hidden><span>Paused</span><small>Click to resume</small></button>
    </div>
    <aside class="sudoku-controls">
      <div class="entry-mode-toggle" role="group" aria-label="Entry mode">
        <button class="game-button entry-mode-button active" id="normal-button" type="button" aria-pressed="true">Normal</button>
        <button class="game-button entry-mode-button" id="candidate-button" type="button" aria-pressed="false">Candidate</button>
      </div>
      <div class="number-pad" id="number-pad"></div>
      <div class="sudoku-actions" aria-label="Sudoku actions">
        <button class="game-button icon-button" id="undo-button" type="button" aria-label="Undo" title="Undo">
          <svg class="stroke-icon redo-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.25 9.25A7.5 7.5 0 1 0 19.1 15"/><path d="M19.5 3.75v4.5H15"/></svg>
        </button>
        <button class="game-button icon-button" id="redo-button" type="button" aria-label="Redo" title="Redo">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.25 9.25A7.5 7.5 0 1 0 19.1 15"/><path d="M19.5 3.75v4.5H15"/></svg>
        </button>
        <button class="game-button icon-button" id="erase-button" type="button" aria-label="Backspace" title="Backspace">
          <svg class="stroke-icon erase-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10.25A2.75 2.75 0 0 1 22 7.75v8.5A2.75 2.75 0 0 1 19.25 19H9L2 12l7-7Z"/><path d="m12 9 6 6M18 9l-6 6"/></svg>
        </button>
        <button class="game-button icon-button" id="hint-button" type="button" aria-label="Hint" title="Hint">
          <svg class="stroke-icon hint-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.5a5.5 5.5 0 0 0-3.2 10c.8.6 1.2 1.2 1.2 2V17h4v-.5c0-.8.4-1.4 1.2-2a5.5 5.5 0 0 0-3.2-10Z"/><path d="M10 19h4M10.7 21h2.6"/>
            <path class="hint-ray" d="M12 1v2M4.2 4.2l1.4 1.4M1 12h2M21 12h2M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </aside>
  </div>
</main>
<div class="game-modal" id="settings-modal" hidden><div class="game-modal-card"><h2>Sudoku settings</h2><div class="settings-list" id="settings-list"></div><button class="game-button" id="close-settings" type="button">Close</button></div></div>
<div class="game-modal" id="stats-modal" hidden><div class="game-modal-card"><h2>Daily stats</h2><div id="stats-content"></div><button class="game-button" id="close-stats" type="button">Close</button></div></div>
</body></html>
